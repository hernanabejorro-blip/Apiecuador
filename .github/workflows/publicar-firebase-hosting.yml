name: Publicar ApiEcuador en Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicación de prueba controlada
    runs-on: ubuntu-latest
    steps:
      - name: Verificar rama de preparación
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/preparar-publicacion-firebase" ]; then
            echo "Por seguridad, este flujo solo se ejecuta desde preparar-publicacion-firebase."
            exit 1
          fi

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Publicar en canal de prueba de Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_APIECUADOR_34B2D }}"
          projectId: apiecuador-34b2d
          channelId: prueba-api-ecuador
          expires: 7d
